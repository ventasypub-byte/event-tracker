<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Walk Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 16px;-webkit-tap-highlight-color:transparent;}
h1{font-size:1.5rem;margin-bottom:4px;letter-spacing:1px;}
.sub{color:#8b949e;font-size:0.8rem;margin-bottom:20px;}
.legend{display:flex;gap:20px;margin-bottom:16px;align-items:center;flex-wrap:wrap;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:0.9rem;}
.legend-item .sw{width:16px;height:16px;border-radius:4px;flex-shrink:0;}
.legend-item input{background:transparent;border:none;border-bottom:1px dashed #8b949e;color:#e6edf3;font-size:0.9rem;width:100px;outline:none;padding:2px 0;}
.legend-item input:focus{border-bottom-color:#58a6ff;}
.mode{display:flex;gap:8px;margin-bottom:18px;}
.mode-btn{display:flex;align-items:center;gap:6px;background:#161b22;color:#8b949e;border:2px solid #30363d;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:0.85rem;}
.mode-btn .sw{width:12px;height:12px;border-radius:3px;background:#58a6ff;}
.mode-btn.gold .sw{background:#d4a017;}
.mode-btn.act{border-color:#58a6ff;color:#e6edf3;}
.mode-btn.gold.act{border-color:#d4a017;color:#e6edf3;}
.stats{display:flex;gap:32px;margin-bottom:16px;font-size:1rem;font-weight:600;flex-wrap:wrap;justify-content:center;}
.stats .sb{color:#58a6ff;}
.stats .sg{color:#d4a017;}
.stats span.n{font-size:1.4rem;margin-right:4px;}
.bar-c{width:100%;max-width:420px;margin-bottom:20px;height:24px;border-radius:8px;overflow:hidden;display:flex;background:#161b22;}
.bar-b{background:#58a6ff;height:100%;transition:width 0.4s;}
.bar-g{background:#d4a017;height:100%;transition:width 0.4s;}
.ysel{display:flex;gap:6px;margin-bottom:14px;}
.ysel button{background:#161b22;color:#8b949e;border:1px solid #30363d;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:0.85rem;}
.ysel button.act{background:#21262d;color:#e6edf3;border-color:#58a6ff;}
.ysel button:hover{color:#e6edf3;}
.gc{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:960px;}
.mb{display:flex;flex-direction:column;align-items:center;gap:3px;}
.mn{font-size:0.7rem;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.mg{display:grid;grid-template-columns:repeat(7,32px);grid-auto-rows:36px;gap:3px;}
.d{width:32px;height:36px;border-radius:4px;background:#161b22;cursor:pointer;display:flex;flex-direction:row;justify-content:center;align-items:flex-end;gap:2px;padding:3px 2px;position:relative;transition:transform 0.1s;}
.d:hover{transform:scale(1.25);z-index:10;}
@media(pointer:coarse){.d:hover{transform:none;}}
.d.e{visibility:hidden;cursor:default;}
.d.f{opacity:0.3;}
.d.t{outline:2px solid #e6edf3;outline-offset:1px;}
.d.bf{opacity:0.1;pointer-events:none;}
.ev{width:8px;height:100%;border-radius:2px;cursor:pointer;flex-shrink:0;transition:opacity 0.15s;}
.ev:hover{opacity:0.6;}
.ev.blue{background:#58a6ff;}
.ev.gold{background:#d4a017;}
.tt{position:fixed;background:#1c2128;border:1px solid #30363d;padding:6px 10px;border-radius:6px;font-size:0.78rem;pointer-events:none;display:none;z-index:100;white-space:nowrap;}
.streak{font-size:0.82rem;color:#8b949e;margin-bottom:14px;text-align:center;}
.ft{color:#484f58;font-size:0.7rem;margin-top:20px;text-align:center;}
</style>
</head>
<body>
<h1>Dog Walk Tracker</h1>
<p class="sub">Desde 2 Abr 2026</p>
<div class="legend">
  <div class="legend-item"><div class="sw" style="background:#58a6ff"></div><input id="nb" placeholder="Persona 1" maxlength="20"></div>
  <div class="legend-item"><div class="sw" style="background:#d4a017"></div><input id="ng" placeholder="Persona 2" maxlength="20"></div>
</div>
<div class="mode">
  <button class="mode-btn act" id="mbtn-b"><div class="sw"></div><span id="ml-b">Azul</span></button>
  <button class="mode-btn gold" id="mbtn-g"><div class="sw"></div><span id="ml-g">Dorado</span></button>
</div>
<div class="stats" id="st"></div>
<div class="bar-c"><div class="bar-b" id="bb"></div><div class="bar-g" id="bg"></div></div>
<div class="streak" id="sk"></div>
<div class="ysel" id="ys"></div>
<div class="gc" id="gr"></div>
<div class="tt" id="tp"></div>
<p class="ft">Tap dia = agregar · Tap bloque = quitar</p>
<script>
var MES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
var yr=2026,data={},mode="blue";
var START="2026-04-02";
var q=function(id){return document.getElementById(id);};

function load(){
  var gotData=false,gotNames=false;
  function ready(){if(gotData&&gotNames){grid();stats();}}
  fetch("/api/data/"+yr).then(function(r){return r.json();}).then(function(d){data=d;gotData=true;ready();}).catch(function(){data={};gotData=true;ready();});
  fetch("/api/names").then(function(r){return r.json();}).then(function(n){q("nb").value=n.blue||"";q("ng").value=n.gold||"";updML();gotNames=true;ready();}).catch(function(){gotNames=true;ready();});
}

function saveN(){
  fetch("/api/names",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({blue:q("nb").value,gold:q("ng").value})});
  updML();
}

function addEv(day){
  var evts=data[day]||[];
  if(evts.length>=3)return;
  fetch("/api/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({year:yr,day:day,value:mode})})
  .then(function(r){return r.json();}).then(function(r){
    if(r.id){if(!data[day])data[day]=[];data[day].push({id:r.id,value:mode});grid();stats();}
  });
}

function rmEv(day,id){
  fetch("/api/event/"+id,{method:"DELETE"}).then(function(){
    data[day]=(data[day]||[]).filter(function(e){return e.id!==id;});
    if(data[day].length===0)delete data[day];
    grid();stats();
  });
}

function setMode(m){
  mode=m;
  q("mbtn-b").className="mode-btn"+(m==="blue"?" act":"");
  q("mbtn-g").className="mode-btn gold"+(m==="gold"?" act":"");
}

function updML(){
  q("ml-b").textContent=q("nb").value||"Azul";
  q("ml-g").textContent=q("ng").value||"Dorado";
}

function dk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function isT(d){var t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();}
function isF(d){var t=new Date();t.setHours(0,0,0,0);return d>t;}

function calcStreaks(){
  var today=dk(new Date());
  // current streaks: find last event day per person, count consecutive back
  // streak alive only if last event is today or yesterday
  var csB=0,csG=0;
  var allKeys=Object.keys(data).filter(function(k){return k>=START;}).sort();
  var lastB="",lastG="";
  for(var a=0;a<allKeys.length;a++){
    var ae=data[allKeys[a]];
    for(var ai=0;ai<ae.length;ai++){if(ae[ai].value==="blue")lastB=allKeys[a];if(ae[ai].value==="gold")lastG=allKeys[a];}
  }
  var yesterday=new Date();yesterday.setHours(0,0,0,0);yesterday.setDate(yesterday.getDate()-1);
  var ydk=dk(yesterday);
  // blue streak
  if(lastB>=ydk&&lastB!==""){
    var db=new Date(lastB+"T00:00:00");
    while(true){
      var kb=dk(db),eb=data[kb]||[],hb=false;
      for(var bi=0;bi<eb.length;bi++){if(eb[bi].value==="blue")hb=true;}
      if(hb)csB++;else break;
      db.setDate(db.getDate()-1);if(dk(db)<START)break;
    }
  }
  // gold streak
  if(lastG>=ydk&&lastG!==""){
    var dg=new Date(lastG+"T00:00:00");
    while(true){
      var kg=dk(dg),eg=data[kg]||[],hg=false;
      for(var gi=0;gi<eg.length;gi++){if(eg[gi].value==="gold")hg=true;}
      if(hg)csG++;else break;
      dg.setDate(dg.getDate()-1);if(dk(dg)<START)break;
    }
  }
  // best streaks (longest consecutive run)
  var sorted=Object.keys(data).filter(function(k){return k>=START;}).sort();
  var bsB=0,bsG=0,rB=0,rG=0,prev="";
  for(var i=0;i<sorted.length;i++){
    var k3=sorted[i],evts2=data[k3];
    var hB=false,hG=false;
    for(var j=0;j<evts2.length;j++){if(evts2[j].value==="blue")hB=true;if(evts2[j].value==="gold")hG=true;}
    // check if consecutive day
    var isConsec=false;
    if(prev){
      var pd=new Date(prev+"T00:00:00");pd.setDate(pd.getDate()+1);
      isConsec=dk(pd)===k3;
    }
    if(hB){rB=isConsec||!prev?rB+1:1;if(rB>bsB)bsB=rB;}else{rB=0;}
    if(hG){rG=isConsec||!prev?rG+1:1;if(rG>bsG)bsG=rG;}else{rG=0;}
    prev=k3;
  }
  return{curB:csB,curG:csG,bestB:bsB,bestG:bsG};
}

function stats(){
  var b=0,g=0;
  for(var day in data){var evts=data[day];for(var i=0;i<evts.length;i++){if(evts[i].value==="blue")b++;else if(evts[i].value==="gold")g++;}}
  var bn=q("nb").value||"Azul",gn=q("ng").value||"Dorado";
  var s=calcStreaks();
  var crownB=b>g?" 👑":"",crownG=g>b?" 👑":"";
  var fireB=s.curB>0?" 🔥":"",fireG=s.curG>0?" 🔥":"";
  q("st").innerHTML="<div class=sb><span class=n>"+b+"</span>"+bn+crownB+fireB+"</div><div class=sg><span class=n>"+g+"</span>"+gn+crownG+fireG+"</div>";
  q("sk").innerHTML="Mejor racha: "+bn+" <b>"+s.bestB+"</b>d | "+gn+" <b>"+s.bestG+"</b>d";
  var tot=b+g||1;
  q("bb").style.width=(b/tot*100)+"%";
  q("bg").style.width=(g/tot*100)+"%";
}

function yearSel(){
  var c=q("ys");c.innerHTML="";
  [2026,2027].forEach(function(y){
    var btn=document.createElement("button");btn.textContent=y;
    if(y===yr)btn.className="act";
    btn.onclick=function(){yr=y;load();yearSel();};
    c.appendChild(btn);
  });
}

function grid(){
  var g=q("gr");g.innerHTML="";
  var sm=yr===2026?3:0;
  for(var m=sm;m<12;m++){
    var bl=document.createElement("div");bl.className="mb";
    var lb=document.createElement("div");lb.className="mn";lb.textContent=MES[m];
    bl.appendChild(lb);
    var mg=document.createElement("div");mg.className="mg";
    var fd=new Date(yr,m,1),sd=fd.getDay();sd=sd===0?6:sd-1;
    for(var i=0;i<sd;i++){var em=document.createElement("div");em.className="d e";mg.appendChild(em);}
    var dim=new Date(yr,m+1,0).getDate();
    for(var d=1;d<=dim;d++){
      var dt=new Date(yr,m,d),key=dk(dt);
      var before=key<START;
      var el=document.createElement("div");
      el.className="d"+(isT(dt)?" t":"")+(isF(dt)?" f":"")+(before?" bf":"");
      var evts=data[key]||[];
      for(var j=0;j<evts.length;j++){
        var ev=document.createElement("div");
        ev.className="ev "+evts[j].value;
        ev.addEventListener("click",(function(dk2,eid){return function(e){e.stopPropagation();rmEv(dk2,eid);};})(key,evts[j].id));
        el.appendChild(ev);
      }
      if(!before){
        el.addEventListener("click",(function(dk2){return function(){addEv(dk2);};})(key));
      }
      el.dataset.lb=d+" "+MES[m]+" "+yr;
      el.addEventListener("mouseenter",(function(kr,er){return function(ev){
        var tt=q("tp"),ev2=data[kr]||[];
        var bn=q("nb").value||"Azul",gn=q("ng").value||"Dorado";
        var cb=0,cg=0;ev2.forEach(function(e){if(e.value==="blue")cb++;else cg++;});
        var p=[];if(cb)p.push(cb+" "+bn);if(cg)p.push(cg+" "+gn);
        tt.textContent=er.dataset.lb+(p.length?" — "+p.join(", "):"");
        tt.style.display="block";tt.style.left=ev.clientX+12+"px";tt.style.top=ev.clientY-30+"px";
      };})(key,el));
      el.addEventListener("mouseleave",function(){q("tp").style.display="none";});
      mg.appendChild(el);
    }
    bl.appendChild(mg);g.appendChild(bl);
  }
}

q("mbtn-b").addEventListener("click",function(){setMode("blue");});
q("mbtn-g").addEventListener("click",function(){setMode("gold");});
q("nb").addEventListener("input",function(){saveN();stats();});
q("ng").addEventListener("input",function(){saveN();stats();});
yearSel();load();
</script>
</body>
</html>
